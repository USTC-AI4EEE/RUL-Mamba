dataset:
  name: TJU
  input_mode: Univariable
  battery_cache_path: Data/TJU_Data/Dataset_3_NCM_NCA_Battery_1C.npy
  real_data_path_template: Results/Capacity_{test_name}_Real_Data.pth
  rated_capacity: 2.5
  test_name: CY25_1
  start_points: [200, 300, 400]

features:
  time_varying_known_reals:
    - Capacity
  time_varying_unknown_reals:
    - target

window:
  seq_len: 64
  label_len: 0
  pred_len: 1

train:
  count: 10
  batch_size: 128
  max_epochs: 200
  learning_rate: 0.001
  patience: 20
  gradient_clip_val: 0.2
  predict_batch_size: 256
  train_split_ratio: 0.8
  num_workers: 0
  shuffle_train: true
  drop_last_train: false

runtime:
  seed: 2025
  auto_select_gpu: true

output:
  results_dir: Results
  logs_dir: Logs
  outputs_dir: Outputs
  results_filename_template: "{dataset}_{input_mode}_{model}_{test_name}.pth"
  log_filename_template: "{dataset}_{input_mode}_{model}_{test_name}.log"
  plot_dir_template: "Plots/{dataset}/{input_mode}/{test_name}/{model}"
